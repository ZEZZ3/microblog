
services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microblog
      MYSQL_USER: microblog
      MYSQL_PASSWORD: microblogpassword

  prod:
    build:
      context: .
      dockerfile: docker/Dockerfile_prod
    ports:
      - "8000:5000"
    environment:
      SECRET_KEY: dev-secret-key
      DATABASE_URL: mysql+pymysql://microblog:microblogpassword@db/microblog
    depends_on:
      - db


  test:
    build:
      context: .
      dockerfile: docker/Dockerfile_test
    volumes:
      - ./app:/microblog/app
      - ./tests:/microblog/tests
